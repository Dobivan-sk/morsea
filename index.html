async function coopJoin(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const st = $('coStatus');
  if (code.length !== 4) { if (st) st.textContent = tr('coNoRoom'); return; }
  if (!(await coopConnect(st))) return;
  const ref = roomRef(code);
  let room;
  try { room = (await ref.once('value')).val(); } catch (e) { if (st) st.textContent = tr('coNoNet'); return; }
  const err = !room || !room.host ? 'coNoRoom'
    : room.host.uid === CO.uid ? 'coOwn'
    : room.guest && room.guest.uid !== CO.uid ? 'coFull'
    : room.phase !== 'lobby' && !(room.guest && room.guest.uid === CO.uid) ? 'coStarted' : '';
  if (err) { if (st) st.textContent = tr(err); return; }
  try { await ref.child('guest').set({ uid: CO.uid, name: playerName() }); } catch (e) { if (st) st.textContent = tr('coNoNet'); return; }
  coopReset();
  Object.assign(CO, { on: true, role: 'g', code, ref, peer: { name: cleanText(room.host.name, NAME_MAX) || tr('coCaptain'), ship: cleanText(room.host.ship, SHIP_MAX) || 'Morse.-' } });
  coopPresence();
  listen(ref.child('on/h'), 'value', s => {
    CO.peerOnline = s.val() === true;
    clearTimeout(CO.lostTimer);
    if (!CO.peerOnline && S.inGame && S.mode !== 'over') CO.lostTimer = setTimeout(() => crewEnd('lost'), CAPTAIN_GRACE * 1000);
  });
  listen(ref.child('phase'), 'value', s => {
    const ph = s.val();
    if (ph === null && !CO.ended) { if (S.inGame && S.mode !== 'over') crewEnd('captLeft'); else { coopReset(); showCoop(tr('coCaptLeft')); } return; }
    if (ph === 'play' && (!S.inGame || S.mode === 'over')) crewStart();
  });
  listen(ref.child('over'), 'value', s => { const o = s.val(); if (o && S.inGame && S.mode !== 'over') crewEnd(o.reason, o); });
  listen(ref.child('state'), 'value', s => crewApply(s.val()));
  listen(ref.child('ev'), 'child_added', s => { const e = s.val(); s.ref.remove().catch(() => {}); crewEvent(e); });
  listen(ref.child('typing/h'), 'value', s => { CO.peerLetter = s.val() || ''; renderPeer(); });
  listen(ref.child('pause'), 'value', s => remotePause(s.val()));
  if (room.phase === 'play') crewStart();
  else showOverlay(`
    <h2>${tr('coTitle')}</h2>
    <p>${tr('coJoined', CO.peer.name, CO.peer.ship)}</p>
    <p class="co-who" role="status">${tr('coWaitCapt')}</p>
    <button class="cta alt" id="goBack">${tr('back')}</button>
  `, '#goBack');
  if ($('goBack')) $('goBack').addEventListener('click', () => { coopLeave(); showMenu(); });
}

/* --- starting a game --- */
function captainStart() {
  if (!CO.peer) return;
  Object.assign(CO, { gScore: 0, gStreak: 0, alone: false, ended: false, lastSnap: 0 });
  CO.sunk.clear();
  S.tempo = 'coop';
  CO.ref.update({ phase: 'play', over: null, ev: null, cmd: null, pause: null, state: null }).catch(() => {});
  startGame(1, 0);
  renderPeer();
  publishState(true);
}
function crewStart() {
  clearTimeout(CO.lostTimer);
  CO.ended = false;
  S.tempo = 'coop';
  startGame(1, 0);
  S.spawnT = 1e9; S.radarT = 1e9;   // the captain's device sends submarines and sonar sweeps
  renderPeer();
}

/* --- captain: state out, crew shots in --- */
function publishState(force) {
  if (!isCaptain() || (!CO.peerOnline && !force)) return;
  const now = performance.now();
  if (!force && now - CO.lastSnap < 150) return;
  CO.lastSnap = now;
  const jam = {};
  [S.level, S.level + 1].forEach(lv => { if (seaOf(lv) === BLACK_SEA) jam[lv] = sectorOf(lv); });
  CO.ref.child('state').set({
    lv: S.level, lt: Math.round(S.levelTime * 100) / 100, lives: S.lives, mode: S.mode,
    subs: S.subs.map(s => [s.id, s.li, s.row, Math.round(s.age * 100) / 100, Math.round(s.fuse * 100) / 100, s.flip ? 1 : 0]),
    jam, sc: { h: S.score, g: CO.gScore }, st: { h: S.streak, g: CO.gStreak },
  }).catch(() => {});
}
// One shot from either player, decided on the captain's device. The first shot at a submarine sinks it;
// a second one at the same square within 3 s finds it already gone and costs nothing.
function resolveShot(by, letter, digit) {
  const col = sectorOf(S.level).indexOf(letter), row = DIGITS.indexOf(digit);
  if (col < 0 || row < 0) return null;
  const li = base() + col, key = li + ':' + row;
  const sub = S.subs.find(s => s.li === li && s.row === row);
  const res = { li, row, coord: spoken(letter, digit), hit: !!sub, pts: 0, mult: 1, late: false };
  if (sub) {
    S.subs = S.subs.filter(s => s !== sub);
    CO.sunk.set(key, anim);
    const streak = by === 'h' ? ++S.streak : ++CO.gStreak;
    res.mult = multOf(streak);
    res.pts = (100 + 10 * S.level + Math.max(0, Math.round((sub.fuse - sub.age) * 10))) * res.mult;
    if (by === 'g') CO.gScore += res.pts;
  } else if ((CO.sunk.get(key) ?? -99) > anim - 3) {
    res.late = true;
  } else if (by === 'h') S.streak = 0; else CO.gStreak = 0;
  return res;
}
function captainShot(letter, digit) {
  const res = resolveShot('h', letter, digit);
  if (!res) { sfx.error(); toast(tr('tRange', spoken(letter, digit)), 'warn'); return; }
  shotFx('h', res, true, true);
  emit('shot', Object.assign({ by: 'h' }, res));
  publishState(true);
}
function crewShot(letter, digit) {
  const res = resolveShot('g', letter, digit);
  if (!res) return;
  shotFx('g', res, false, true);
  emit('shot', Object.assign({ by: 'g' }, res));
  publishState(true);
}

/* --- shared effects --- */
// The captain fires from the bow, the crew from the stern.
function gunAt(by) {
  const half = SHIP[0].length * G.PS * 0.36;
  return { x: G.shipX + (by === 'h' ? half : -half), y: G.shipY + G.PS * 3 };
}
function shotFx(by, res, own, shell) {
  const to = cellCenter(res.li, res.row), gun = gunAt(by);
  if (shell) {
    sfx.fire();
    S.fx.push({ type: 'mark', li: res.li, row: res.row, t: 0, dur: 1.2, color: own ? C.amber : C.sonar,
      label: own ? tr('fireAt', res.coord) : peerName() + ': ' + tr('fireAt', res.coord) });
  }
  S.fx.push({ type: 'shell', x0: gun.x, y0: gun.y, x1: to.x, y1: to.y, t: 0, dur: shell ? 0.4 : 0.01, onDone: () => shotResult(by, res, own) });
}
function shotResult(by, res, own) {
  const to = cellCenter(res.li, res.row);
  if (res.hit) {
    boom(to.x, to.y, false); sfx.boom();
    floatText(to.x, to.y, '+' + res.pts + (res.mult > 1 ? ' ×' + res.mult : ''), own ? C.amber : C.sonar);
    if (own) {
      S.score += res.pts;   // on the crew's device the captain's next snapshot confirms it
      toast(tr('tHit', res.coord));
      addXP(res.pts);
    } else toast(peerName() + ': ' + tr('tHit', res.coord));
  } else if (res.late) {
    if (own) toast(tr('coLate', res.coord), 'warn');
  } else {
    splash(to.x, to.y); sfx.splash();
    if (own) toast(tr('tMiss', res.coord), 'warn');
  }
  updateHUD();
}

/* --- crew: mirror the captain's sea --- */
function crewFire(letter, digit) {
  const col = sectorOf(S.level).indexOf(letter);
  const coord = spoken(letter, digit);
  if (col < 0) { sfx.error(); toast(tr('tRange', coord), 'warn'); return; }
  const li = base() + col, row = DIGITS.indexOf(digit);
  const to = cellCenter(li, row), gun = gunAt('g');
  sfx.fire();
  S.fx.push({ type: 'mark', li, row, t: 0, dur: 1.2, label: tr('fireAt', coord) });
  S.fx.push({ type: 'shell', x0: gun.x, y0: gun.y, x1: to.x, y1: to.y, t: 0, dur: 0.4 });
  CO.ref.child('cmd').push({ type: 'fire', l: letter, d: digit }).catch(() => {});
}
function crewUpdate(dt) {
  S.levelTime = Math.min(LEVEL_TIME, S.levelTime + dt);
  for (const s of S.subs) s.age += dt;
}
function crewApply(st) {
  if (!isCrew() || !st || !S.inGame || S.mode === 'over') return;
  if (st.jam) for (const k of Object.keys(st.jam)) S.jam[+k] = st.jam[k];
  if (Number.isFinite(st.lives)) S.lives = st.lives;
  if (st.sc) { S.score = st.sc.g || 0; CO.peerScore = st.sc.h || 0; }
  if (st.st) S.streak = st.st.g || 0;
  if (st.mode === 'transition' && S.mode === 'play' && st.lv === S.level) {
    S.subs = []; clearInput(true); beginShift();
  } else if (st.mode === 'transition' && S.mode === 'won') {
    hideOverlay(); beginShift();
  } else if (st.mode === 'won' && S.mode === 'play') {
    S.mode = 'won'; S.subs = []; clearInput(true); sfx.level();
    setTimeout(() => { if (S.mode === 'won') showOverlay(`<h2>${seaOf(S.level).done}</h2><p class="co-who">${tr('coSeaWait')}</p>`); }, 1100);
  } else if (st.mode === 'play' && st.lv !== S.level && S.mode !== 'paused') {
    S.level = st.lv; S.transition = null; S.mode = 'play'; S.levelTime = st.lt || 0;
    renderCheat();
  }
  if (S.mode === 'play' && st.mode === 'play' && st.lv === S.level) {
    S.levelTime = st.lt || 0;
    const have = new Map(S.subs.map(s => [s.id, s]));
    S.subs = (st.subs || []).map(([id, li, row, age, fuse, fl]) => {
      const o = have.get(id);
      if (o) { o.age = age; o.fuse = fuse; return o; }
      return { id, li, row, age, fuse, flip: !!fl, revealAt: -99 };
    });
  }
  updateHUD(); renderPeer();
}
function crewEvent(e) {
  if (!isCrew() || !e || !S.inGame || S.mode === 'over') return;
  if (e.type === 'ping') { sweep(); sfx.ping(); }
  else if (e.type === 'torp') {
    S.subs = S.subs.filter(s => !(s.li === e.li && s.row === e.row));
    torpedoFx(e.li, e.row, () => shipHitFx());
  } else if (e.type === 'shot') {
    const own = e.by === 'g';
    shotFx(e.by, e, own, !own);
  } else if (e.type === 'bonus') {
    floatText(G.shipX, G.shipY - G.PS * 4, tr('bonus'), C.sonar);
    addXP(e.pts || 0);
  }
}
function shipHitFx() {
  S.shake = reduceMotion ? 0 : 1;
  S.shipFlash = 0.5;
  boom(G.shipX + (Math.random() - 0.5) * G.PS * 20, G.shipCY, true);
  sfx.hit();
  toast(tr('tShipHit'), 'bad');
}

/* --- partner's coordinate and score, shown on the battlefield --- */
function sendTyping() {
  if (!coop() || !CO.ref) return;
  const v = I.letter || '';
  if (v === CO.lastTyping) return;
  CO.lastTyping = v;
  CO.ref.child('typing/' + CO.role).set(v).catch(() => {});
}
function renderPeer() {
  const el = $('peerTag');
  if (!el) return;
  const show = coop() && S.inGame && !!CO.peer;
  el.hidden = !show;
  if (!show) return;
  el.innerHTML = `${mHtml(esc(peerName()))} <b>${CO.role === 'h' ? CO.gScore : CO.peerScore}</b> · ${CO.peerLetter ? mHtml(CO.peerLetter) + '_' : '—'}`;
}

/* --- pause, lost connections, the end --- */
function remotePause(p) {
  if (!coop() || !S.inGame || S.mode === 'over') return;
  if (p && (S.mode === 'play' || S.mode === 'transition')) {
    CO.remotePause = true; pause(); CO.remotePause = false;
    if (p.by !== CO.role) { const line = $('coPauseBy'); if (line) line.textContent = tr('coPausedBy', peerName()); }
  } else if (!p && S.mode === 'paused' && !CO.waitTimer) {
    CO.remotePause = true; resume(); CO.remotePause = false;
  }
}
function crewGone(left) {
  if (CO.alone) return;
  if (S.mode === 'play' || S.mode === 'transition') { CO.remotePause = true; pause(); CO.remotePause = false; }
  let left_s = left ? 0 : CREW_WAIT;
  const paint = () => showOverlay(`
    <h2>${tr('paused')}</h2>
    <p>${left ? tr('coCrewLeft', peerName()) : tr('coLostCrew', peerName())}</p>
    ${left_s > 0 ? `<p class="co-who" id="coCount">${tr('coWaitSec', left_s)}</p>` : ''}
    <button class="cta" id="coAlone"${left_s > 0 ? ' disabled' : ''}>${tr('coAlone')}</button>
    <button class="cta alt" id="coEnd">${tr('coEnd')}</button>
  `, '#coEnd');
  const wire = () => {
    $('coAlone').addEventListener('click', () => { clearInterval(CO.waitTimer); CO.waitTimer = null; CO.alone = true; renderPeer(); resume(); });
    $('coEnd').addEventListener('click', () => { clearInterval(CO.waitTimer); CO.waitTimer = null; captainEnd('home'); });
  };
  paint(); wire();
  clearInterval(CO.waitTimer);
  CO.waitTimer = setInterval(() => {
    left_s = Math.max(0, left_s - 1);
    const c = $('coCount');
    if (c) c.textContent = tr('coWaitSec', left_s);
    if (left_s === 0) { clearInterval(CO.waitTimer); CO.waitTimer = 'done'; paint(); wire(); }
  }, 1000);
}
function crewBack() {
  clearInterval(CO.waitTimer); CO.waitTimer = null;
  toast(tr('coBackCrew', peerName()));
  CO.ref.child('pause').set(null).catch(() => {});
  if (S.mode === 'paused') { CO.remotePause = true; resume(); CO.remotePause = false; }
  publishState(true);
}
// Captain: the game ends (ship sunk, all seas done, or the captain went home).
function captainEnd(reason) {
  if (CO.ended) return;
  CO.ended = true;
  clearInterval(CO.waitTimer); CO.waitTimer = null;
  const final = { reason, h: S.score, g: CO.gScore, lv: S.level, t: Date.now() };
  CO.ref.update({ phase: 'over', over: final, pause: null }).catch(() => {});
  publishState(true);
  coopFinish(reason, final);
}
// Crew: the captain ended it, or went silent.
function crewEnd(reason, final) {
  if (CO.ended) return;
  CO.ended = true;
  clearTimeout(CO.lostTimer);
  coopFinish(reason, final || { reason, h: CO.peerScore, g: S.score, lv: S.level });
}
function coopFinish(reason, final) {
  const wasPlaying = S.mode !== 'over';
  S.mode = 'over'; S.transition = null;
  clearInput(true);
  recordGame(reason === 'sunk' ? 'sunk' : reason === 'won' ? 'won' : 'home');
  if (reason === 'sunk' && wasPlaying) {
    setTimeout(() => boom(G.shipX - G.PS * 8, G.shipCY, true), 250);
    setTimeout(() => { boom(G.shipX + G.PS * 10, G.shipCY, true); sfx.boom(); }, 550);
    sfx.lose();
  }
  setTimeout(() => showCoopEnd(reason, final), reason === 'sunk' ? 1500 : 300);
}
function showCoopEnd(reason, final) {
  const me = CO.role === 'h' ? 'h' : 'g';
  const rows = [
    { who: 'h', name: me === 'h' ? playerName() : peerName(), role: tr('coCaptain'), pts: final.h || 0 },
    { who: 'g', name: me === 'g' ? playerName() : peerName(), role: tr('coCrew'), pts: final.g || 0 },
  ];
  const top = Math.max(rows[0].pts, rows[1].pts);
  const title = reason === 'sunk' ? tr('sinking') : reason === 'won' ? tr('allSeas') : tr('coEndTitle');
  const line = reason === 'lost' ? tr('coLostCapt') : reason === 'captLeft' ? tr('coCaptLeft')
    : tr('pauseLine', seaOf(final.lv || S.level).name, levelInSea(final.lv || S.level), sectorOf(final.lv || S.level).join(' · '), '').replace(/[^.]*\.\s*$/, '').trim();
  showOverlay(`
    <h2 class="${reason === 'sunk' ? 'bad' : ''}">${title}</h2>
    <p>${esc(line)}</p>
    <ol class="co-score">${rows.map(r => `
      <li class="${r.pts === top && top > 0 ? 'top' : ''}${r.who === me ? ' me' : ''}">
        <span><b>${esc(r.name)}</b><small>${r.role}</small></span><span class="val">${r.pts}</span>
      </li>`).join('')}</ol>
    ${CO.role === 'h' && reason !== 'home' ? `<button class="cta" id="coAgain"${CO.peerOnline ? '' : ' disabled'}>${tr('coAgain')}</button>` : ''}
    ${CO.role === 'g' && (reason === 'sunk' || reason === 'won') ? `<p class="co-who">${tr('coWaitCapt')}</p>` : ''}
    <button class="cta alt" id="goMenu">${tr('homeScreen')}</button>
  `, '#goMenu');
  if ($('coAgain')) $('coAgain').addEventListener('click', captainStart);
  $('goMenu').addEventListener('click', () => {
    coopLeave();
    Object.assign(S, { subs: [], fx: [], ring: null, transition: null, level: 1, levelTime: 0, score: 0, lives: MAX_LIVES, inGame: false });
    clearInput(true); updateHUD(); renderCheat();
    showMenu();
  });
}
function coopSeaEnd() {
  const sea = seaOf(S.level), next = SEAS[SEAS.indexOf(sea) + 1];
  if (!next) { captainEnd('won'); return; }
  showOverlay(`
    <canvas class="hero" aria-hidden="true"></canvas>
    <h2>${sea.done}</h2>
    <p>${tr('seaCleared', sea.levels, sectorOf(S.level).join(' · '))}</p>
    ${next === BLACK_SEA ? `<p class="story">${tr('jamStory')}</p>` : ''}
    <button class="cta" id="goSea">${next.ask}</button>
    <button class="cta alt" id="goMenu">${tr('coEnd')}</button>
  `);
  $('goSea').addEventListener('click', () => {
    initAudio(); hideOverlay();
    S.lives = MAX_LIVES; updateHUD();
    beginShift();
    publishState(true);
  });
  $('goMenu').addEventListener('click', () => captainEnd('home'));
}
// A link like …/?room=KX7Q opens the join screen straight away (after the welcome window on a first start).
const ROOM_FROM_URL = (() => {
  try {
    const u = new URL(location.href), c = (u.searchParams.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    if (c) { u.searchParams.delete('room'); window.history.replaceState(null, '', u.pathname + (u.search || '') + u.hash); }   // window.: history() is the score list here
    return c;
  } catch (e) { return ''; }
})();
let roomLinkUsed = false;

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (S.mode !== 'paused') anim += dt;
  if (S.mode === 'play') update(dt);
  else if (S.mode === 'transition') updateTransition(dt);
  if (S.mode !== 'paused') updateFx(dt);
  if (isCaptain() && S.inGame) publishState(false);
  if (I.down) updateKeyFill();
  musicTick();
  updateTimer();
  draw();
  requestAnimationFrame(frame);
}

applyLang(); renderCheat();
try { window.claude?.hot?.snapshot?.(() => ({ level: S.level, score: S.levelStartScore })); } catch (e) {}
const boot = d => {
  if (d && d.level > 1) S.resume = { level: Math.min(TOTAL_LEVELS, d.level), score: d.score || 0 };
  showMenu();
};
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch (e) { boot({}); }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
