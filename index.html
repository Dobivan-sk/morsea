/* Layout: one-screen phone console. HUD strip on top, sonar battlefield canvas in the middle (flex), morse console at the bottom.
   Single dark look on purpose: a destroyer's sonar room at night. */
:root{
  --abyss:#06111c;
  --sea:#0a2034;
  --sea-lit:#14395a;
  --lane:#0c2a44;
  --sea-med:#0a3149;      /* Mediterranean: a touch lighter, toward azure */
  --lane-med:#0d3a55;
  --sea-lit-med:#1b4f70;  /* its waves, lifted by the same step so they read like the Atlantic's */
  --sea-black:#05080c;    /* Black Sea: almost black, Soviet-red labels */
  --lane-black:#090f15;
  --soviet:#cc0000;
  --grid:#24557a;
  --panel:#0b1926;
  --panel-edge:#21425f;
  --sonar:#5fe3b0;
  --amber:#ffb547;
  --danger:#ff5b4d;
  --steel:#9aa9b6;
  --ink:#d9e8f3;
  --ink-dim:#7f9bb2;
  --f-display:"Silkscreen","Silkscreen SK","Courier New",monospace;
  --f-body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* A game, not a document: holding the Morse key (or any button) must never start a text selection,
   the iOS copy callout or the tap highlight. Only the XML box stays selectable. */
html,body,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
textarea,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html{height:100%;background:var(--abyss)}
body{height:100%;margin:0;background:var(--abyss);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.15;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}

/* HUD */
.hud{display:flex;align-items:flex-end;gap:14px}
.hud-cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font-family:var(--f-display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.val{font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.sector{color:var(--sonar)}
.hud .spacer{flex:1}
.lives{display:flex;gap:4px;color:var(--danger);padding-bottom:2px}
.lives svg{width:16px;height:14px;display:block}
.lives .lost{color:var(--panel-edge)}
.pixel-btn{background:var(--panel);border:2px solid var(--panel-edge);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;cursor:pointer;min-height:36px}
.pixel-btn:active{transform:translateY(1px);box-shadow:none}
.pixel-btn[aria-pressed="true"]{border-color:var(--sonar);color:var(--sonar)}
.pause-btn{width:36px;padding:0;font-size:13px}
.timebar{height:8px;background:var(--panel);border:2px solid var(--panel-edge);position:relative;overflow:hidden}
.timebar span{position:absolute;inset:0 auto 0 0;width:0;background:var(--sonar)}

/* Battlefield */
.field{position:relative;flex:1;min-height:0;border:2px solid var(--panel-edge);background:var(--sea);overflow:hidden}
.field canvas{position:absolute;inset:0;display:block;image-rendering:pixelated}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);max-width:calc(100% - 20px);font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:2px solid var(--sonar);color:var(--sonar);padding:6px 10px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;text-align:center}
.toast{--ls:.06em}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--danger);color:var(--danger)}
/* Co-op: the partner's name, score and the letter they are keying, bottom-right of the battlefield */
.peer-tag{position:absolute;right:6px;bottom:6px;max-width:calc(100% - 12px);font-family:var(--f-display);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:2px solid var(--panel-edge);color:var(--ink-dim);padding:4px 7px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer-tag b{color:var(--sonar);font-weight:700}
.co-code{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.12em;color:var(--amber)}
.co-qr{align-self:center;image-rendering:pixelated;border:3px solid var(--panel-edge)}
.co-who{font-size:18px;color:var(--ink-dim)}
.co-who.ok{color:var(--sonar)}
.co-in{font-family:var(--f-display);font-size:28px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.co-score{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.co-score li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border:2px solid var(--panel-edge)}
.co-score li span:first-child{display:flex;flex-direction:column;text-align:left}
.co-score small{font-family:var(--f-display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.co-score li.top{border-color:var(--sonar)}
.co-score li.top .val{color:var(--sonar)}
.co-score li.me b::after{content:" ◂";color:var(--amber)}
.toast.warn{border-color:var(--amber);color:var(--amber)}

/* Morse console */
.console{display:flex;flex-direction:column;gap:8px}
.readout{display:flex;gap:8px}
.slots{display:flex;gap:4px}
.slot{width:44px;height:50px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;background:var(--panel);border:2px solid var(--panel-edge);color:var(--panel-edge)}
.slot.word{width:auto;min-width:44px;padding:0 8px;font-size:16px}
.slot.filled{border-color:var(--sonar);color:var(--sonar)}
.slot.last{color:var(--ink-dim)}
.buffer{flex:1;min-width:0;background:var(--panel);border:2px solid var(--panel-edge);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.sym{display:flex;gap:5px;align-items:center;height:12px}
.sym i{display:block;height:8px;background:var(--amber)}
.sym i.dot{width:8px}
.sym i.dash{width:24px}
.hint{font-size:19px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--amber);font-weight:400}
.cheat{background:var(--panel);border:2px solid var(--panel-edge);padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.cheat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0 6px;font-size:18px;font-variant-numeric:tabular-nums}
.cheat-row.letters{grid-template-columns:repeat(3,1fr);color:var(--sonar);font-size:20px}
.cheat-row span{white-space:nowrap}
.cheat-row b{font-family:var(--f-display);font-size:11px;margin-right:4px;color:var(--ink)}
.cheat-row.letters b{color:var(--sonar);font-size:12px}
.tools{display:flex;gap:6px}
.tools .pixel-btn{flex:1;min-width:0;padding-inline:4px}
.key{position:relative;height:78px;border:3px solid var(--sonar);background:var(--panel);color:var(--sonar);box-shadow:inset 0 -5px 0 rgba(0,0,0,.4);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.key.down{background:var(--sonar);color:var(--abyss);box-shadow:none;transform:translateY(2px)}
.key-label{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.14em}
.key-sub{font-size:17px;opacity:.85}
.key-bar{position:absolute;left:8px;right:8px;top:6px;height:4px;background:rgba(0,0,0,.25)}
.key-bar span{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber)}
.key-bar span.dash{background:var(--danger)}

/* Overlay screens */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,17,28,.9);display:flex;align-items:center;justify-content:center;overflow:auto;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.card{width:100%;max-width:420px;margin:auto;background:var(--panel);border:3px solid var(--panel-edge);box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.card canvas{align-self:center;image-rendering:pixelated;max-width:100%}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance;text-align:center;letter-spacing:.04em}
.card h1{font-size:39px;color:var(--sonar);text-shadow:3px 3px 0 var(--abyss)}
/* Start screen fills the height; logo, name and claim sit low in the space above the controls, near the screen's middle */
.card.menu{min-height:100%}
.menu-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-block:12px 5px}
.card .lead{font-size:22px;color:var(--sonar)}
.lang-seg{display:flex;gap:4px;align-self:flex-end}
/* Start screen top row: the player and ship on the left, the language switch on the right */
.menu-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu-top .lang-seg{flex:none}
.profile-chip{min-width:0;min-height:32px;padding:4px 0;background:none;border:none;color:var(--ink-dim);font-family:var(--f-body);font-size:18px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline dotted;text-underline-offset:4px}
.profile-chip:hover,.profile-chip:focus-visible{color:var(--ink)}
/* Player and ship form */
.field-row{display:flex;flex-direction:column;gap:6px}
.field-row .seg-label{text-align:left}
.text-in{width:100%;min-height:44px;background:var(--abyss);color:var(--ink);border:2px solid var(--panel-edge);font-family:var(--f-body);font-size:22px;padding:6px 10px;border-radius:0;outline:none}
.text-in:focus{border-color:var(--sonar)}
.text-in::placeholder{color:var(--ink-dim);opacity:.7}
.lang-seg .pixel-btn{min-width:44px;min-height:32px;padding:4px 8px}
/* Breathing room between the start screen's blocks: up to one claim line (23px) each when the screen has
   room to spare, shrinking to nothing on short screens; the negative margins cancel the card's own gap */
.menu-space{flex:1000 1 0;max-height:23px;margin-block:-7px;min-height:0}
.menu-row{display:flex;gap:6px}
.menu-row .pixel-btn{flex:1;min-height:44px;border-color:var(--sonar);color:var(--sonar)}
.card.menu #tempoNote{font-size:17px;margin-top:-6px}
/* Rank badge on the start screen and the ranks list */
.rank-badge{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:6px;cursor:pointer;color:var(--ink)}
.rank-badge canvas{image-rendering:pixelated}
.rank-name{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);--ls:.08em;text-align:center}
.rank-next{font-size:16px;color:var(--ink-dim);text-align:center}
.rank-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.rank-list li{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px;padding:6px 4px;border-bottom:2px solid var(--panel-edge);opacity:.45}
.rank-list li.got{opacity:1}
.rank-list li:last-child{border-bottom:none}
.rank-art{display:flex;justify-content:center}
.rank-art canvas{image-rendering:pixelated}
.rank-text{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:16px;color:var(--ink-dim)}
.rank-text b{font-family:var(--f-display);font-size:10px;letter-spacing:.06em;color:var(--ink);font-weight:700}
.rank-list li.got .rank-text b{color:var(--amber)}
.toast.promo{border-color:var(--amber);color:var(--amber)}
.hud .mult{color:var(--abyss);background:var(--amber);padding:0 4px;margin-left:2px}
/* Promotion / end-of-Training notice over the battlefield */
.notice{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(86%,340px);background:var(--panel);border:3px solid var(--amber);box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;pointer-events:none;z-index:5}
.field .notice canvas{position:static;inset:auto;display:block;image-rendering:pixelated}
.notice p{margin:0;font-size:21px;line-height:1.2;color:var(--ink)}
.rank-xp{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;color:var(--sonar);font-variant-numeric:tabular-nums}
.dock-card{border:2px solid var(--panel-edge);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dock-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;font-size:17px;color:var(--ink-dim)}
.card .story{color:var(--soviet);border:2px solid var(--soviet);padding:8px 10px;font-size:18px}
.letter-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.letter-grid .pixel-btn{--ls:.08em;min-height:44px;padding:0;font-size:14px;font-weight:700;border-color:var(--sonar);color:var(--sonar)}
/* Title "Morse.-": dot and dash drawn on Silkscreen's pixel grid (1 unit = .125em), centred on the cap height,
   spaced like the gap between two letters */
.card h1 .tm{display:inline-block;height:.125em;background:currentColor;box-shadow:3px 3px 0 var(--abyss);position:relative;bottom:.25em}
.card h1 .tm.dot{width:.125em;margin-left:.125em}
.card h1 .tm.dash{width:.375em;margin-left:.29em;margin-right:.04em}
/* Silkscreen's M reads as H: one dot-sized pixel centred under its crossbar (units 3.5–4.5 of its 8-unit advance).
   --ls is the letter-spacing of the surrounding text, which the M's advance includes. */
.mnotch{display:inline-block;width:.125em;height:.125em;background:currentColor;position:relative;bottom:.125em;margin-left:calc(-.5625em - var(--ls, 0px));margin-right:calc(.4375em + var(--ls, 0px))}
.card h1{--ls:.04em}
.nw{white-space:nowrap}
.card h2{font-size:22px;color:var(--amber)}
.card h2.bad{color:var(--danger)}
.card p{margin:0;font-size:20px;color:var(--ink);text-align:center}
.card .sub{color:var(--ink-dim);margin-top:-8px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:19px}
.rules li{display:grid;grid-template-columns:12px 1fr;gap:8px}
.rules li::before{content:"";width:6px;height:6px;margin-top:7px;background:var(--sonar)}
.rules code{font-family:var(--f-body);color:var(--amber);font-size:20px}
.seg-label{font-family:var(--f-display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-align:center}
.seg{display:flex;gap:4px}
.seg .pixel-btn{flex:1}
.cta{background:var(--sonar);color:var(--abyss);border:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;padding:14px;cursor:pointer}
.cta:active{transform:translateY(2px);box-shadow:none}
.cta.alt{background:transparent;color:var(--sonar);border:2px solid var(--sonar);box-shadow:none}
.foot{font-size:17px;color:var(--ink-dim);text-align:center}
.card .credit{font-size:16px;letter-spacing:.06em;color:var(--ink-dim)}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.hist li{display:flex;align-items:center;gap:12px;padding-block:6px;border-bottom:2px solid var(--panel-edge)}
.hist li:last-child{border-bottom:none}
.hist-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hist-when{font-size:18px}
.hist-meta{font-size:16px;color:var(--ink-dim)}
.hist .val{font-size:16px;font-variant-numeric:tabular-nums}
.hist li.top .val{color:var(--sonar)}
.hist-tools{display:flex;gap:6px}
.hist-tools .pixel-btn{flex:1}
.pixel-btn:disabled{opacity:.45;cursor:default}
.card .hist-status{font-size:17px;color:var(--amber)}
.card .hist-status:empty{display:none}
.hist-copy{display:flex;flex-direction:column;gap:6px}
.hist-xml{width:100%;height:140px;resize:vertical;background:var(--abyss);color:var(--ink);border:2px solid var(--panel-edge);font-family:var(--f-body);font-size:15px;padding:6px}
.stats{display:flex;justify-content:center;gap:24px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.stats .val{font-size:18px}

@media (max-height:640px){
  .key{height:64px}
  .slot{height:44px}
  .cheat-row{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .toast{transition:none}
}

<style>
/* What the claude.ai viewer adds around the page: keep content clear of the phone's top and bottom bars */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* On an iPhone the system blurs the strip just under the status bar: on a phone with a notch or island
   (top inset > 0) the game and the start screen sit 7px lower, taking those 7px from the bottom inset,
   so nothing sits in that strip */
@supports (padding:max(0px, env(safe-area-inset-top))) {
  :root{padding-top:calc(env(safe-area-inset-top,0px) + min(7px, env(safe-area-inset-top,0px)));
        padding-bottom:max(0px, calc(env(safe-area-inset-bottom,0px) - min(7px, env(safe-area-inset-top,0px))))}
  .overlay{padding-top:calc(max(16px, env(safe-area-inset-top,0px)) + min(7px, env(safe-area-inset-top,0px)));
           padding-bottom:max(16px, calc(env(safe-area-inset-bottom,0px) - min(7px, env(safe-area-inset-top,0px))))}
}
img{max-width:100%}
</style>

/* ---------- music ---------- */
// One 4-bar chiptune loop per sea, on an eighth-note grid. '.' holds the previous note (or rests at the start);
// perc: k = kick, s = snare, h = hi-hat.
const SONGS = [
  { // Atlantic: calm, A minor
    bpm: 84,
    lead: ['A4','.','C5','.','E5','.','D5','C5',  'A4','.','F4','.','A4','C5','.','.',
           'B4','.','D5','.','G4','.','B4','D5',  'E5','.','.','D5','C5','.','B4','.'],
    bass: ['A2','.','A2','.','E2','.','A2','.',  'F2','.','F2','.','C3','.','F2','.',
           'G2','.','G2','.','D3','.','G2','.',  'E2','.','E2','.','B2','.','E2','.'],
    perc: 'k.......h.......k.......h.......',
  },
  { // Mediterranean: bright, D major
    bpm: 112,
    lead: ['D5','F#5','A5','F#5','D5','.','A4','.',  'B4','D5','G5','D5','B4','.','G4','.',
           'C#5','E5','A5','E5','C#5','.','E5','.',  'F#5','E5','D5','.','A4','.','D5','.'],
    bass: ['D2','.','A2','.','D2','.','A2','.',  'G2','.','D3','.','G2','.','D3','.',
           'A2','.','E3','.','A2','.','E3','.',  'D2','.','A2','.','D2','.','A2','.'],
    perc: 'k.h.s.h.k.h.s.h.k.h.s.h.k.h.s.hh',
  },
  { // Black Sea: heavy march, D minor
    bpm: 96,
    lead: ['D4','.','D4','F4','A4','.','.','A4',  'G4','.','G4','A4','Bb4','.','A4','G4',
           'A4','.','E4','.','A4','.','C#5','.',  'D5','.','A4','.','F4','E4','D4','.'],
    bass: ['D2','.','A1','.','D2','.','A1','.',  'G1','.','D2','.','G1','.','D2','.',
           'A1','.','E2','.','A1','.','E2','.',  'D2','.','A1','.','D2','.','D2','.'],
    perc: 'k.s.k.s.k.s.k.s.k.s.k.s.k.s.k.ss',
  },
];
const NOTE_IX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const noteHz = n => {
  const m = /^([A-G])(#|b)?(\d)$/.exec(n);
  const midi = 12 * (+m[3] + 1) + NOTE_IX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
};
// Steps each note lasts: itself plus the holds after it.
const holds = seq => seq.map((n, i) => { if (n === '.') return 0; let k = 1; while (seq[i + k] === '.') k++; return k; });
SONGS.forEach(s => { s.leadLen = holds(s.lead); s.bassLen = holds(s.bass); });

// Level: the music sits a constant 15 dB below the morse key tone, compared by RMS.
// Key tone: sine at gain 0.26 → RMS 0.26/√2. Music voices: square lead at 1.0 (RMS 1.0) and triangle bass
// at 0.8 (RMS 0.8/√3), summed as power. The bus gain scales that mix to the target; each song's `trim`
// (dB) is what an offline render of its loop measured missing from that estimate (note decays and rests).
const KEY_RMS = 0.26 * Math.SQRT1_2;
const MUSIC_RMS = Math.sqrt(1.0 * 1.0 + (0.8 * 0.8) / 3);
const MUSIC_GAIN = KEY_RMS * Math.pow(10, -15 / 20) / MUSIC_RMS;
SONGS[0].trim = 3.95; SONGS[1].trim = 3.59; SONGS[2].trim = 3.78;
const songGain = song => MUSIC_GAIN * Math.pow(10, song.trim / 20);
const MUSIC = { on: store.get('music', true), bus: null, song: -1, step: 0, next: 0 };

function mVoice(freq, t, dur, type, amp) {
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(amp, t + 0.008);
  g.gain.setTargetAtTime(amp * 0.7, t + 0.01, 0.1);
  g.gain.setTargetAtTime(0, t + dur, 0.02);
  o.connect(g); g.connect(MUSIC.bus);
  o.start(t); o.stop(t + dur + 0.2);
}
function mPerc(kind, t) {
  if (kind === 'k') {
    const o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(MUSIC.bus); o.start(t); o.stop(t + 0.2);
    return;
  }
  const s = A.ctx.createBufferSource(), f = A.ctx.createBiquadFilter(), g = A.ctx.createGain();
  s.buffer = A.noiseBuf; f.type = 'highpass'; f.frequency.value = kind === 's' ? 1500 : 7000;
  const dur = kind === 's' ? 0.1 : 0.03;
  g.gain.setValueAtTime(kind === 's' ? 0.45 : 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MUSIC.bus); s.start(t); s.stop(t + dur + 0.02);
}
// Called every frame: keeps ~0.25 s of notes scheduled ahead while a game is running.
function musicTick() {
  if (!A.ctx || !MUSIC.bus || !MUSIC.on || !S.sound || (S.mode !== 'play' && S.mode !== 'transition')) { MUSIC.song = -1; return; }
  const idx = SEAS.indexOf(seaOf(S.transition ? S.level + 1 : S.level));
  const now = A.ctx.currentTime;
  const song = SONGS[idx], dt = 60 / song.bpm / 2;
  if (idx !== MUSIC.song || MUSIC.next < now - 0.1) {
    MUSIC.song = idx; MUSIC.step = 0; MUSIC.next = now + 0.06;
    MUSIC.bus.gain.setValueAtTime(songGain(song), now);
  }
  while (MUSIC.next < now + 0.25) {
    const i = MUSIC.step, t = MUSIC.next;
    if (song.lead[i] !== '.') mVoice(noteHz(song.lead[i]), t, song.leadLen[i] * dt * 0.92, 'square', 1.0);
    if (song.bass[i] !== '.') mVoice(noteHz(song.bass[i]), t, song.bassLen[i] * dt * 0.92, 'triangle', 0.8);
    if (song.perc[i] && song.perc[i] !== '.') mPerc(song.perc[i], t);
    MUSIC.step = (i + 1) % song.lead.length;
    MUSIC.next += dt;
  }
}

const sfx = {
  // the game's own sonar recording; the synthesized ping stands in until it is decoded (or if it can't be)
  ping() {
    if (A.ctx && A.sonar) {
      const s = A.ctx.createBufferSource(), g = A.ctx.createGain();
      s.buffer = A.sonar; g.gain.value = SONAR_GAIN;
      s.connect(g); g.connect(A.master); s.start();
      return;
    }
    blip(1400, 0.45, { vol: 0.16, f2: 1000 }); blip(1400, 0.35, { vol: 0.05, f2: 1000, delay: 0.28 });
  },
  fire()   { noise(0.2, { vol: 0.35, type: 'bandpass', freq: 1200 }); blip(220, 0.15, { type: 'square', vol: 0.07, f2: 90 }); },
  boom()   { noise(0.9, { vol: 0.6, freq: 500 }); blip(90, 0.5, { type: 'triangle', vol: 0.3, f2: 35 }); },
  splash() { noise(0.35, { vol: 0.22, type: 'highpass', freq: 1500 }); },
  launch() { blip(320, 0.7, { type: 'sawtooth', vol: 0.05, f2: 110 }); },
  hit()    { noise(1.1, { vol: 0.7, freq: 350 }); blip(70, 0.8, { type: 'square', vol: 0.14, f2: 30 }); },
  error()  { blip(150, 0.14, { type: 'square', vol: 0.07 }); },
  level()  { [523, 659, 784, 1047].forEach((f, i) => blip(f, 0.14, { type: 'square', vol: 0.06, delay: i * 0.09 })); },
  lose()   { [392, 330, 262, 196].forEach((f, i) => blip(f, 0.26, { type: 'square', vol: 0.07, delay: i * 0.18 })); },
};

/* ---------- layout ---------- */
let W = 0, H = 0, DPR = 1, G = null;
function resize() {
  const r = field.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = Math.max(1, Math.floor(r.width - 4));
  H = Math.max(1, Math.floor(r.height - 4));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const gutter = Math.round(Math.max(62, W * 0.17));   // wide enough for "-----" under the digits in level 1
  const cellW = (W - gutter - 4) / 3;
  const unit = H / 12.5;
  const headH = unit * 1.1, shipH = unit * 1.4, cellH = unit;
  G = {
    gutter, cellW, cellH, headH, shipH,
    x0: gutter, y0: headH, gridW: cellW * 3,
    shipY: headH + 5 * cellH, yBottom: headH + 5 * cellH + shipH,
    P: Math.max(2, Math.floor(Math.min(cellW / 24, cellH / 8.5))),
    MS: Math.max(2, Math.min(3, Math.floor((gutter - 4) / 19), Math.floor(cellH / 10))),
    PS: Math.max(2, Math.floor(Math.min(shipH / 13, (cellW * 3) / 44))),
  };
  G.shipX = G.x0 + G.gridW / 2;
  G.shipCY = G.shipY + G.shipH / 2;
  G.maxR = Math.hypot(Math.max(G.shipX, W - G.shipX), Math.max(G.shipCY, H - G.shipCY));
}
new ResizeObserver(resize).observe(field);
resize();

const rowY = r => (r < 5 ? G.y0 + r * G.cellH : G.yBottom + (r - 5) * G.cellH);
const base = () => S.level - 1;
const shift = () => (S.transition ? S.transition.shift : 0);
function cellCenter(li, row) {
  return { x: G.x0 + (li - base() - shift()) * G.cellW + G.cellW / 2, y: rowY(row) + G.cellH / 2 };
}

/* ---------- difficulty ---------- */
// Training (slow tempo) and Normal keep one submarine on the grid at a time and never speed up: a new one
// comes some 5-6 s after the last, and it fires after 20 s in Training, 15 s in Normal, in every level.
// Fast tightens until about level 10, then holds: at most 3 submarines, >= 12 s to fire, a new one every
// >= 4 s. Simulated over all 76 levels, a player who fires every 4-5 s loses no lives and one at 6 s per
// shot loses about a dozen, so every sea stays passable.
const learning = () => S.tempo === 'slow';
const oneAtATime = () => S.tempo === 'slow' || S.tempo === 'normal';   // Co-op plays like the former Fast mode
const maxSubs = lv => (oneAtATime() ? 1 : Math.min(3, 1 + Math.floor((lv + 1) / 6)));
const fuseFor = lv => (learning() ? 20 + Math.random()
  : oneAtATime() ? 15 + Math.random()
  : Math.max(12, 15.5 - 0.4 * (lv - 1)) + Math.random() * 2);
const spawnGap = lv => (oneAtATime() ? 4.85 : Math.max(4, 5 - lv * 0.15)) + Math.random() * 1.5;

/* ---------- game flow ---------- */
function startGame(level = 1, score = 0) {
  initAudio();
  Object.assign(S, {
    mode: 'play', level, levelTime: 0, lives: MAX_LIVES, score, levelStartScore: score, hitThisLevel: false, streak: 0,
    subs: [], fx: [], ring: null, transition: null, radarT: 1, spawnT: 0.6, shake: 0, shipFlash: 0, resume: null,
    inGame: true, recorded: false, jam: {},
  });
  clearInput(true);
  hideOverlay();
  renderCheat(); updateHUD();
  requestWakeLock();
  if (seaOf(level) === BLACK_SEA) setTimeout(() => toast(tr('jammer'), 'warn'), 400);
}

function update(dt) {
  if (isCrew()) { crewUpdate(dt); return; }
  S.levelTime += dt;
  if (S.levelTime >= LEVEL_TIME) { startTransition(); return; }

  for (const s of S.subs) s.age += dt;
  const firing = S.subs.filter(s => s.age >= s.fuse);
  if (firing.length) {
    S.subs = S.subs.filter(s => s.age < s.fuse);
    firing.forEach(launchTorpedo);
  }

  S.radarT -= dt;
  if (S.radarT <= 0) { S.radarT += RADAR_EVERY; radarPing(); }

  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    if (S.subs.length < maxSubs(S.level)) spawnSub();
    S.spawnT = spawnGap(S.level);
  }
}

function spawnSub() {
  const free = [];
  for (let c = 0; c < 3; c++) for (let r = 0; r < 10; r++) {
    const li = base() + c;
    if (!S.subs.some(s => s.li === li && s.row === r)) free.push([li, r]);
  }
  if (!free.length) return;
  const [li, row] = free[Math.floor(Math.random() * free.length)];
  S.subs.push({ id: S.nextId++, li, row, age: 0, fuse: fuseFor(S.level), revealAt: -99, flip: Math.random() < 0.5 });
}

function radarPing() {
  sweep();
  sfx.ping();
  emit('ping');
}
function sweep() {
  S.ring = { t0: anim };
  const speed = G.maxR / RING_TIME;
  for (const s of S.subs) {
    const p = cellCenter(s.li, s.row);
    s.revealAt = anim + Math.hypot(p.x - G.shipX, p.y - G.shipCY) / speed;
  }
}

function launchTorpedo(sub) {
  torpedoFx(sub.li, sub.row, torpedoHit);
  emit('torp', { li: sub.li, row: sub.row });
}
function torpedoFx(li, row, onDone) {
  const from = cellCenter(li, row);
  const tx = Math.min(Math.max(from.x, G.shipX - G.PS * 15), G.shipX + G.PS * 15);
  const ty = G.shipCY + (from.y < G.shipCY ? -G.PS * 2 : G.PS * 3);
  S.fx.push({ type: 'torpedo', x0: from.x, y0: from.y, x1: tx, y1: ty, t: 0, dur: 1.0, onDone });
  sfx.launch();
  toast(tr('tTorpedo', spoken(colLetter(li), DIGITS[row])), 'bad');
}

function torpedoHit() {
  if (S.mode !== 'play' && S.mode !== 'transition') return;
  S.lives--;
  S.streak = 0;
  if (isCaptain()) CO.gStreak = 0;   // one ship: a torpedo ends both streaks
  S.hitThisLevel = true;
  S.shake = reduceMotion ? 0 : 1;
  S.shipFlash = 0.5;
  boom(G.shipX + (Math.random() - 0.5) * G.PS * 20, G.shipCY, true);
  sfx.hit();
  toast(tr('tShipHit'), 'bad');
  updateHUD();
  publishState(true);
  if (S.lives <= 0) gameOver();
}

function fire(letter, digit) {
  if (isCrew()) { crewFire(letter, digit); return; }
  if (isCaptain()) { captainShot(letter, digit); return; }
  const col = sectorOf(S.level).indexOf(letter);
  const row = DIGITS.indexOf(digit);
  const coord = spoken(letter, digit);
  if (col < 0) {
    sfx.error();
    toast(tr('tRange', coord), 'warn');
    return;
  }
  const li = base() + col;
  const sub = S.subs.find(s => s.li === li && s.row === row);
  if (sub) S.subs = S.subs.filter(s => s !== sub);   // resolved now so it can't fire while the shell flies
  const to = cellCenter(li, row);
  sfx.fire();
  S.fx.push({ type: 'mark', li, row, t: 0, dur: 1.2, label: tr('fireAt', coord) });
  S.fx.push({
    type: 'shell', x0: G.shipX, y0: G.shipY + G.PS * 3, x1: to.x, y1: to.y, t: 0, dur: 0.4,
    onDone: () => {
      if (sub) {
        S.streak++;
        const mult = streakMult();
        const pts = (100 + 10 * S.level + Math.max(0, Math.round((sub.fuse - sub.age) * 10))) * mult;
        S.score += pts;
        boom(to.x, to.y, false);
        sfx.boom();
        floatText(to.x, to.y, '+' + pts + (mult > 1 ? ' ×' + mult : ''), C.amber);
        toast(tr('tHit', coord));
        updateHUD();
        addXP(pts);
      } else {
        S.streak = 0;
        updateHUD();
        splash(to.x, to.y);
        sfx.splash();
        toast(tr('tMiss', coord), 'warn');
      }
    },
  });
}

function startTransition() {
  S.subs = [];
  clearInput(true);
  if (!S.hitThisLevel) {
    S.score += 250;
    floatText(G.shipX, G.shipY - G.PS * 4, tr('bonus'), C.sonar);
    addXP(250);
    if (isCaptain() && !CO.alone) { CO.gScore += 250; emit('bonus', { pts: 250 }); }
  }
  saveBest(); updateHUD();
  if (S.level === seaOf(S.level).last) {
    S.mode = 'won';
    sfx.level();
    publishState(true);
    setTimeout(isCaptain() ? coopSeaEnd : showSeaEnd, 1100);
    return;
  }
  beginShift();
}
function beginShift() {
  S.mode = 'transition';
  S.transition = { t: 0, shift: 0 };
  sfx.level();
}
function updateTransition(dt) {
  const tn = S.transition;
  tn.t += dt;
  const p = Math.min(1, Math.max(0, (tn.t - 0.3) / 1.0));
  tn.shift = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  if (tn.t >= 2.0) {
    S.level++;
    S.transition = null;
    S.levelTime = 0; S.hitThisLevel = false; S.levelStartScore = S.score;
    S.radarT = 0.5; S.spawnT = 1.0;
    S.mode = 'play';
    renderCheat(); updateHUD();
    if (seaOf(S.level) === BLACK_SEA) toast(tr('jammer'), 'warn');
  }
}

function gameOver() {
  if (isCaptain()) { captainEnd('sunk'); return; }
  S.mode = 'over';
  S.transition = null;
  clearInput(true);
  recordGame('sunk');
  setTimeout(() => boom(G.shipX - G.PS * 8, G.shipCY, true), 250);
  setTimeout(() => { boom(G.shipX + G.PS * 10, G.shipCY, true); sfx.boom(); }, 550);
  sfx.lose();
  setTimeout(showGameOver, 1500);
}

function saveBest() {
  if (S.score > S.best) { S.best = S.score; store.set('best', S.best); }
}

/* ---------- ranks (U.S. Navy officer grades) ---------- */
// Earned with experience (XP): every point won in every game adds up, for good. XP from Training counts
// only up to Lieutenant (TRAIN_XP_CAP); beyond that only Normal / Fast XP raises the rank.
// store 'xp' = { combat, train }; store 'rank' = index of the highest rank shown so far (-1 = none yet).
const RANKS = [
  { code: 'O-1',  name: 'Ensign',                         abbr: 'ENS',  min: 5000,    art: 'bar',   metal: 'gold' },
  { code: 'O-2',  name: 'Lieutenant Junior Grade',        abbr: 'LTJG', min: 75000,   art: 'bar',   metal: 'silver' },
  { code: 'O-3',  name: 'Lieutenant',                     abbr: 'LT',   min: 200000,  art: 'bars',  metal: 'silver' },
  { code: 'O-4',  name: 'Lieutenant Commander',           abbr: 'LCDR', min: 350000,  art: 'leaf',  metal: 'gold' },
  { code: 'O-5',  name: 'Commander',                      abbr: 'CDR',  min: 650000,  art: 'leaf',  metal: 'silver' },
  { code: 'O-6',  name: 'Captain',                        abbr: 'CAPT', min: 1000000, art: 'eagle', metal: 'silver' },
  { code: 'O-7',  name: 'Rear Admiral Lower Half',        abbr: 'RDML', min: 1300000, art: 'stars', stars: 1 },
  { code: 'O-8',  name: 'Rear Admiral Upper Half',        abbr: 'RADM', min: 1600000, art: 'stars', stars: 2 },
  { code: 'O-9',  name: 'Vice Admiral',                   abbr: 'VADM', min: 1900000, art: 'stars', stars: 3 },
  { code: 'O-10', name: 'Admiral',                        abbr: 'ADM',  min: 2250000, art: 'stars', stars: 4 },
];
const TRAINING_TOP_RANK = 2;   // Lieutenant
const TRAIN_XP_CAP = RANKS[TRAINING_TOP_RANK].min;
const rankLabel = i => `${RANKS[i].name} (${RANKS[i].abbr})`;
const XP = { combat: 0, train: 0 };
const xpTotal = () => XP.combat + Math.min(XP.train, TRAIN_XP_CAP);
function rankForXP(x) {
  let r = -1;
  RANKS.forEach((k, i) => { if (x >= k.min) r = i; });
  return r;
}
(function loadXP() {
  const d = store.get('xp', null);
  if (d && Number.isFinite(d.combat)) { XP.combat = Math.max(0, d.combat); XP.train = Math.max(0, d.train || 0); return; }
  // first run of this version: start at the threshold of the rank already earned, so nobody loses it
  const old = store.get('rank', -1);
  if (Number.isInteger(old) && old >= 0) XP.combat = RANKS[Math.min(old, RANKS.length - 1)].min;
  store.set('xp', { combat: XP.combat, train: XP.train });
})();
S.rank = rankForXP(xpTotal());
store.set('rank', S.rank);

// Streak multiplier (Normal / Fast only): 1st hit in a row ×1, 2nd–5th ×2, 6th on ×3.
const streakMult = () => (S.tempo === 'slow' ? 1 : S.streak >= 6 ? 3 : S.streak >= 2 ? 2 : 1);

function addXP(n) {
  if (!(n > 0)) return;
  const trainBefore = XP.train;
  if (S.tempo === 'slow') XP.train += n; else XP.combat += n;
  store.set('xp', { combat: XP.combat, train: XP.train });
  const r = rankForXP(xpTotal());
  if (r > S.rank) {
    S.rank = r; store.set('rank', r);
    announce({ rank: r, text: tr('promoted', rankLabel(r)) });
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => blip(f, 0.16, { type: 'square', vol: 0.07, delay: 0.25 + i * 0.11 }));
  }
  if (S.tempo === 'slow' && trainBefore < TRAIN_XP_CAP && XP.train >= TRAIN_XP_CAP) announce({ text: tr('trainDone') });
}

// Big in-game notice over the battlefield (promotion with its insignia, the end of Training), one at a time.
const notices = [];
let noticeTimer = null;
function announce(n) {
  notices.push(n);
  if (!noticeTimer) nextNotice();
}
function nextNotice() {
  const box = $('notice'), n = notices.shift();
  if (!n) { box.hidden = true; noticeTimer = null; return; }
  box.innerHTML = (n.rank != null ? `<canvas data-rank="${n.rank}" data-px="5" aria-hidden="true"></canvas>` : '') +
    `<p>${esc(n.text)}</p>`;
  paintAllInsignia(box);
  box.hidden = false;
  noticeTimer = setTimeout(nextNotice, 4200);
}

// Pixel-art insignia. d = outline, b = body, h = highlight (gold or silver).
const INSIGNIA = {
  bar: ['ddddd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'dbhbd', 'ddddd'],
  bars: ['ddddddddddddd', 'dbhbdbbbdbhbd', 'dbhbdddddbhbd', 'dbhbd...dbhbd', 'dbhbd...dbhbd', 'dbhbd...dbhbd',
         'dbhbd...dbhbd', 'dbhbd...dbhbd', 'dbhbd...dbhbd', 'dbhbdddddbhbd', 'dbhbdbbbdbhbd', 'ddddddddddddd'],
  leaf: ['.....d.....', '....dbd....', '.d.dbhbd.d.', 'dbddbhbddbd', 'dbbbbhbbbbd', '.dbbbhbbbd.',
         'dbbbbhbbbbd', 'dbbdbhbdbbd', '.dbbbhbbbd.', '..ddbhbdd..', '....dhd....', '.....d.....'],
  eagle: ['dd.............dd', 'dbd...........dbd', 'dbbd...ddd...dbbd', '.dbbd.dhhbd.dbbd.', '.dbbbdbhhbbdbbbd.',
          '..dbbbbbbbbbbbd..', '...ddbbbbbbbdd...', '.....dbbbbbd.....', '......dbbbd......', '.....dd.d.dd.....'],
  star: ['...d...', '..dhd..', '..dhd..', 'ddbhbdd', 'dbbhbbd', '.dbbbd.', '.dbdbd.', 'dbd.dbd', 'dd...dd'],
};
const METAL = {
  gold:   { d: '#6b5310', b: '#d9a82c', h: '#ffe08a' },
  silver: { d: '#3f4c57', b: '#aebbc5', h: '#f2f6f8' },
};
// Draws rank i on a canvas; p = CSS pixels per art pixel. Returns nothing; sizes the canvas itself.
function paintInsignia(cv, i, p) {
  const k = RANKS[i];
  const spr = INSIGNIA[k.art === 'stars' ? 'star' : k.art];
  const n = k.stars || 1, gap = k.art === 'stars' ? 2 : 0;
  const w = spr[0].length * n + gap * (n - 1), h = spr.length;
  const dpr = window.devicePixelRatio || 1, P = Math.max(1, Math.round(p * dpr));
  cv.width = w * P; cv.height = h * P;
  cv.style.width = (w * P / dpr) + 'px'; cv.style.height = (h * P / dpr) + 'px';
  const c = cv.getContext('2d');
  for (let s = 0; s < n; s++) drawSprite(c, spr, s * (spr[0].length + gap) * P, 0, P, METAL[k.metal || 'silver'], false);
}
function paintAllInsignia(root) {
  root.querySelectorAll('canvas[data-rank]').forEach(cv => paintInsignia(cv, +cv.dataset.rank, +cv.dataset.px || 4));
}

// Last 10 runs for the scores window, newest first. Each run is recorded once: sunk, sailed home, or all seas won.
const RESULTS = {};
['sunk', 'home', 'won'].forEach(k => Object.defineProperty(RESULTS, k, { enumerable: true, get: () => L10N[lang].results[k] }));
function history() {
  const h = store.get('history', []);
  return Array.isArray(h) ? h : [];
}
const esc = s => String(s).replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const localIso = t => {
  const d = new Date(t);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
};

// History file: date/time, reason the game ended and score per game, plus mode, sea and level when known.
function historyXml(list) {
  const games = list.map(r => {
    const extra = [];
    if (TEMPO[r.tempo]) extra.push(`    <rezim>${esc(TEMPO[r.tempo].label)}</rezim>`);
    if (SEAS[r.sea]) extra.push(`    <more>${esc(SEAS[r.sea].name)}</more>`);
    if (r.level) extra.push(`    <level>${r.level}</level>`);
    if (r.ship) extra.push(`    <lod>${esc(r.ship)}</lod>`);
    if (r.partner) extra.push(`    <spoluhrac>${esc(r.partner)}</spoluhrac>`);
    return ['  <hra>',
      `    <datum>${localIso(r.t)}</datum>`,
      `    <dovod>${esc(RESULTS[r.result] || r.result)}</dovod>`,
      `    <skore>${r.score}</skore>`,
      ...extra,
      '  </hra>'].join('\n');
  });
  const who = `  <hrac>\n    <meno>${esc(playerName())}</meno>\n    <lod>${esc(shipName())}</lod>\n  </hrac>`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<historia hra="Morse.-" verzia="1">\n${[who, ...games].join('\n')}\n</historia>\n`;
}
function parseHistoryXml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('not xml');
  const runs = [];
  for (const g of doc.getElementsByTagName('hra')) {
    const get = n => (g.getElementsByTagName(n)[0]?.textContent || '').trim();
    const t = new Date(get('datum')).getTime();
    const score = parseInt(get('skore'), 10);
    if (!Number.isFinite(t) || !Number.isFinite(score) || score < 0) continue;
    const reason = get('dovod');
    // Files written in either language import the same way.
    const run = { t, score: Math.min(score, 999999999), result: Object.keys(RESULTS).find(k => LANGS.some(l => L10N[l].results[k] === reason)) || reason.slice(0, 60) };
    const tempo = Object.keys(TEMPO).find(k => LANGS.some(l => L10N[l].tempo[k].label === get('rezim')));
    const sea = SEAS.findIndex((s, i) => LANGS.some(l => L10N[l].seas[i].name === get('more')));
    const level = parseInt(get('level'), 10);
    if (tempo) run.tempo = tempo;
    if (sea >= 0) run.sea = sea;
    if (level > 0) run.level = Math.min(level, 99);
    const ship = cleanText(get('lod'), SHIP_MAX);
    if (ship) run.ship = ship;
    const partner = cleanText(get('spoluhrac'), NAME_MAX);
    if (partner) run.partner = partner;
    runs.push(run);
  }
  return runs;
}
// Imported games join the history (duplicates skipped), newest 10 kept; a higher imported score becomes the record.
// Returns how many of the file's games were new.
function importRuns(runs) {
  const key = r => Math.floor(r.t / 1000) + '|' + r.score;   // the file keeps whole seconds
  const old = history();
  const seen = new Set(old.map(key));
  const fresh = runs.filter(r => { const k = key(r); if (seen.has(k)) return false; seen.add(k); return true; });
  store.set('history', [...fresh, ...old].sort((a, b) => b.t - a.t).slice(0, 10));
  const top = Math.max(...runs.map(r => r.score));
  if (top > S.best) { S.best = top; store.set('best', S.best); }
  return fresh.length;
}

function recordGame(result) {
  if (!S.inGame || S.recorded) return;
  S.recorded = true;
  saveBest();
  const run = { t: Date.now(), tempo: S.tempo, sea: SEAS.indexOf(seaOf(S.level)), level: levelInSea(S.level), score: S.score, result, ship: shipName() };
  if (coop()) {   // a Co-op game sails on the captain's ship, with the partner's name
    if (CO.role === 'g' && CO.peer && CO.peer.ship) run.ship = CO.peer.ship;
    if (CO.peer) run.partner = CO.peer.name;
  }
  store.set('history', [run, ...history()].slice(0, 10));
}

function pause() {
  if (S.mode !== 'play' && S.mode !== 'transition') return;
  S.pausedFrom = S.mode;
  S.mode = 'paused';
  keyRelease(true);
  clearInput(false);
  showPause();
  if (coop() && !CO.remotePause) CO.ref.child('pause').set({ by: CO.role }).catch(() => {});
}
function resume() {
  if (S.mode !== 'paused') return;
  initAudio();
  S.mode = S.pausedFrom || 'play';
  hideOverlay();
  if (coop() && !CO.remotePause) CO.ref.child('pause').set(null).catch(() => {});
}

/* ---------- effects ---------- */
function boom(x, y, big) {
  const parts = [], n = big ? 30 : 20;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (big ? 95 : 65) * (0.35 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 25, g: 70, size: 1 + (Math.random() * 2 | 0) });
  }
  S.fx.push({ type: 'boom', x, y, big, t: 0, dur: big ? 1.1 : 0.9, parts });
}
function splash(x, y) {
  const parts = [];
  for (let i = 0; i < 14; i++) {
    parts.push({ x: x + (Math.random() - 0.5) * 10, y, vx: (Math.random() - 0.5) * 50, vy: -60 - Math.random() * 70, g: 260, size: 1 });
  }
  S.fx.push({ type: 'splash', x, y, t: 0, dur: 0.7, parts });
}
function floatText(x, y, txt, color) { S.fx.push({ type: 'text', x, y, txt, color, t: 0, dur: 1.2 }); }

function updateFx(dt) {
  const list = S.fx;
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    f.t += dt;
    if (f.parts) for (const p of f.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
    if (f.t >= f.dur && !f.done) { f.done = true; if (f.onDone) f.onDone(); }
  }
  S.fx = S.fx.filter(f => !f.done);
  S.shake = Math.max(0, S.shake - dt * 2.5);
  S.shipFlash = Math.max(0, S.shipFlash - dt);
}

/* ---------- drawing ---------- */
const WAVES = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), w: 2 + (Math.random() * 4 | 0), s: 0.6 + Math.random() * 0.8 }));

function draw() {
  if (!G) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * S.shake * 10), Math.round((Math.random() - 0.5) * S.shake * 10));

  TH = seaTheme();
  ctx.fillStyle = TH.sea;
  ctx.fillRect(-12, -12, W + 24, H + 24);
  drawWaves();
  drawGrid();
  drawSubs();
  drawShip();
  drawFx();
  drawRing();
  if (S.transition) drawBanner();
  ctx.restore();
}

function drawWaves() {
  const P = G.P, drift = reduceMotion ? 4 : 14;
  ctx.fillStyle = TH.wave;
  for (const w of WAVES) {
    let x = (w.x * (W + 40) - anim * drift * w.s) % (W + 40);
    if (x < -40) x += W + 40;
    const y = Math.round(w.y * H / P) * P;
    ctx.globalAlpha = 0.55;
    ctx.fillRect(Math.round(x / P) * P, y, w.w * P, P);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = TH.lane;
  ctx.fillRect(0, G.shipY, W, G.shipH);
}

// Pixel dots and dashes centred on (cx, cy): dot = s×s, dash = 3s×s, gap = s.
function drawMorse(code, cx, cy, s, color) {
  let w = s * (code.length - 1);
  for (const c of code) w += c === '.' ? s : 3 * s;
  let x = Math.round(cx - w / 2);
  const y = Math.round(cy - s / 2);
  ctx.fillStyle = color;
  for (const c of code) {
    const len = c === '.' ? s : 3 * s;
    ctx.fillRect(x, y, len, s);
    x += len + s;
  }
}

// Silkscreen's M reads as H: after drawing, put a dot-sized pixel centred under its crossbar
// (units 3.5–4.5 of its 8-unit advance, the row just below the bar).
function fillTextM(text, x, y) {
  ctx.fillText(text, x, y);
  if (!text.includes('M')) return;
  const m = ctx.measureText('M'), u = m.width / 8;
  const start = ctx.textAlign === 'center' ? x - ctx.measureText(text).width / 2 : x;
  for (let i = text.indexOf('M'); i !== -1; i = text.indexOf('M', i + 1)) {
    const ox = start + ctx.measureText(text.slice(0, i)).width;
    ctx.fillRect(ox + 3.5 * u, y + m.actualBoundingBoxDescent - 2 * u, u, u);
  }
}

function drawGrid() {
  const { x0, cellW, cellH, headH, y0, shipY, yBottom, gridW } = G;
  const b = base(), sh = shift();
  // Labels carry their morse code throughout, except in the fast tempo where only level 1 has it (fading out as the ship leaves it).
  const ma = S.tempo === 'coop' ? (S.help ? 1 : 0) : S.tempo !== 'fast' ? 1 : S.level === 1 ? 1 - sh : 0;
  ctx.fillStyle = C.abyss;
  ctx.globalAlpha = 0.6; ctx.fillRect(0, 0, W, headH);
  ctx.globalAlpha = 0.35; ctx.fillRect(0, headH, x0, H - headH);
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.beginPath(); ctx.rect(x0, 0, gridW + 1, H); ctx.clip();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(Math.min(headH * 0.62, 22))}px Silkscreen, "Silkscreen SK", monospace`;
  for (let k = 0; k < 4; k++) {
    const ch = k < 3 ? sectorOf(S.level)[k] : sectorOf(S.level + 1)[2];
    const x = x0 + (k - sh) * cellW;
    const sel = I.letter === ch;
    if (!sel && coop() && CO.peerLetter === ch) {   // the column the partner is aiming at
      ctx.fillStyle = C.amber; ctx.globalAlpha = 0.07;
      ctx.fillRect(x, headH, cellW, H - headH);
      ctx.globalAlpha = 1;
    }
    if (sel) {
      ctx.fillStyle = C.sonar; ctx.globalAlpha = 0.09;
      ctx.fillRect(x, headH, cellW, H - headH);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = sel ? C.sonar : TH.head;
    fillTextM(ch, x + cellW / 2, headH * (0.5 - 0.14 * ma) + 1);
    if (ma > 0) {
      ctx.globalAlpha = ma;
      drawMorse(MORSE[ch], x + cellW / 2, headH * 0.8, G.MS, TH.morse);
      ctx.globalAlpha = 1;
    }
  }
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
  ctx.beginPath();
  for (let k = 0; k <= 4; k++) {
    const x = Math.round(x0 + (k - sh) * cellW) + 0.5;
    ctx.moveTo(x, y0); ctx.lineTo(x, shipY);
    ctx.moveTo(x, yBottom); ctx.lineTo(x, yBottom + 5 * cellH);
  }
  for (let r = 0; r <= 5; r++) {
    let y = Math.round(y0 + r * cellH) + 0.5;
    ctx.moveTo(x0, y); ctx.lineTo(x0 + gridW, y);
    y = Math.round(yBottom + r * cellH) - 0.5;
    ctx.moveTo(x0, y); ctx.lineTo(x0 + gridW, y);
  }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(Math.min(cellH * (0.5 - 0.1 * ma), 18))}px Silkscreen, "Silkscreen SK", monospace`;
  for (let r = 0; r < 10; r++) {
    ctx.fillStyle = TH.row;
    ctx.fillText(DIGITS[r], x0 / 2, rowY(r) + cellH * (0.5 - 0.16 * ma) + 1);
    if (ma > 0) {
      ctx.globalAlpha = ma;
      drawMorse(MORSE[DIGITS[r]], x0 / 2, rowY(r) + cellH * 0.76, G.MS, TH.morse);
      ctx.globalAlpha = 1;
    }
  }
}

function brackets(x, y, w, h, color, len) {
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
  ctx.stroke();
}

// Pixel-font label centred on (x, y), shrunk to fit maxW.
function pixelLabel(text, x, y, maxW, fs) {
  ctx.font = `700 ${fs}px Silkscreen, "Silkscreen SK", monospace`;
  const w = ctx.measureText(text).width;
  if (w > maxW) ctx.font = `700 ${Math.max(6, Math.floor(fs * maxW / w))}px Silkscreen, "Silkscreen SK", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fillTextM(text, x, y);
}

// A radar contact: the submarine with its coordinate in the phonetic alphabet underneath (e.g. ALPHA7).
function drawSubs() {
  const P = Math.max(2, Math.floor(Math.min(G.cellW / 24, G.cellH / 11)));
  const sw = SUB[0].length * P, shh = SUB.length * P;
  const fs = Math.max(8, Math.min(13, Math.round(G.cellH * 0.26)));
  for (const s of S.subs) {
    if (anim < s.revealAt) continue;
    // a contact stays on the map for REVEAL_TIME after the ring finds it, fading out over its last 0.4 s
    const seen = anim - s.revealAt;
    if (seen >= REVEAL_TIME) continue;
    const a = Math.min(1, (REVEAL_TIME - seen) / 0.4);
    const danger = s.fuse - s.age < 4;
    const c = cellCenter(s.li, s.row);
    const top = c.y - (shh + 3 + fs) / 2;
    ctx.globalAlpha = a;
    drawSprite(ctx, SUB, c.x - sw / 2, top, P, danger ? SUB_DANGER : SUB_SONAR, s.flip);
    ctx.fillStyle = danger ? C.danger : C.sonar;
    pixelLabel(spoken(colLetter(s.li), DIGITS[s.row]), c.x, top + shh + 3 + fs / 2 + 1, G.cellW - 12, fs);
    const x = c.x - G.cellW / 2 + 3, y = c.y - G.cellH / 2 + 3;
    brackets(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(G.cellW - 6), Math.round(G.cellH - 6), danger ? C.danger : C.sonar, Math.max(5, G.cellH * 0.22));
  }
  ctx.globalAlpha = 1;
}

function drawShip() {
  const PS = G.PS, sw = SHIP[0].length * PS, shh = SHIP.length * PS;
  const bob = reduceMotion ? 0 : (Math.sin(anim * 2.2) > 0.6 ? -1 : 0);
  const x = Math.round(G.shipX - sw / 2), y = Math.round(G.shipY + G.shipH - shh - PS * 0.5) + bob * PS;
  if (S.mode !== 'over' || anim % 0.3 < 0.2) {
    drawSprite(ctx, SHIP, x, y, PS, SHIP_PAL, false);
    if (S.shipFlash > 0) {
      ctx.globalAlpha = S.shipFlash; ctx.fillStyle = C.danger;
      ctx.fillRect(x, y + shh - 5 * PS, sw, 5 * PS);
      ctx.globalAlpha = 1;
    }
  }
  // stern wake and bow wave
  const wl = y + shh - PS;
  ctx.fillStyle = '#d7ecff';
  for (let i = 0; i < 16; i++) {
    const jitter = Math.sin(i * 12.9 + Math.floor(anim * 8) * 3.1);
    const wx = x - PS * 2 - i * PS * 1.6 - ((anim * 18) % (PS * 1.6));
    ctx.globalAlpha = Math.max(0, 0.8 - i * 0.05);
    ctx.fillRect(Math.round(wx), Math.round(wl + (jitter > 0 ? 0 : PS) - (i % 3 === 0 ? PS : 0)), PS, PS);
  }
  ctx.globalAlpha = 0.7;
  for (let i = 0; i < 3; i++) ctx.fillRect(x + sw - PS * (2 - i), wl - PS * i, PS, PS);
  ctx.globalAlpha = 1;
}

// A circle of whole game pixels (midpoint algorithm): R in pixels, centred on (cx, cy), each pixel drawn once.
function pixelCircle(cx, cy, R, P) {
  let x = R, y = 0, err = 1 - R;
  while (x >= y) {
    const pts = y === 0 ? [[x, 0], [-x, 0], [0, x], [0, -x]]
      : x === y ? [[x, y], [-x, y], [x, -y], [-x, -y]]
      : [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]];
    for (const [a, b] of pts) ctx.fillRect(cx + a * P, cy + b * P, P, P);
    y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}

// The sonar sweep in pixel art: a 1-pixel ring with one fainter echo behind it, fading in steps.
function drawRing() {
  if (!S.ring) return;
  const p = (anim - S.ring.t0) / RING_TIME;
  if (p >= 1.15) { S.ring = null; return; }
  const P = G.P;
  const cx = Math.round(G.shipX / P) * P, cy = Math.round(G.shipCY / P) * P;
  const R = Math.round(p * G.maxR / P);
  const level = [0.6, 0.45, 0.3, 0.15][Math.min(3, Math.floor(p * 4))];
  // only inside the grid: the ring slides under the letter bar, the number column and the bottom edge
  ctx.save();
  ctx.beginPath(); ctx.rect(G.x0, G.y0, G.gridW, G.yBottom + 5 * G.cellH - G.y0); ctx.clip();
  ctx.fillStyle = C.sonar;
  // a single ring travelling out from the ship
  if (R >= 1) {
    ctx.globalAlpha = level;
    pixelCircle(cx, cy, R, P);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFx() {
  const P = G.P;
  for (const f of S.fx) {
    const p = Math.min(1, f.t / f.dur);
    if (f.type === 'shell') {
      for (let k = 0; k < 4; k++) {
        const q = Math.max(0, p - k * 0.05);
        const x = f.x0 + (f.x1 - f.x0) * q, y = f.y0 + (f.y1 - f.y0) * q - Math.sin(q * Math.PI) * 28;
        ctx.globalAlpha = 1 - k * 0.25; ctx.fillStyle = k ? C.amber : '#fff3c4';
        ctx.fillRect(Math.round(x - P), Math.round(y - P), P * 2, P * 2);
      }
      ctx.globalAlpha = 1;
    } else if (f.type === 'torpedo') {
      const x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p;
      ctx.fillStyle = '#d7ecff';
      for (let k = 1; k < 8; k++) {
        const q = Math.max(0, p - k * 0.04);
        ctx.globalAlpha = 0.5 - k * 0.06;
        ctx.fillRect(Math.round(f.x0 + (f.x1 - f.x0) * q - P / 2), Math.round(f.y0 + (f.y1 - f.y0) * q - P / 2), P, P);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.danger;
      ctx.fillRect(Math.round(x - P), Math.round(y - P), P * 2, P * 2);
    } else if (f.type === 'boom') {
      if (p < 0.2) {
        ctx.globalAlpha = 0.5 * (1 - p / 0.2); ctx.fillStyle = C.amber;
        ctx.beginPath(); ctx.arc(f.x, f.y, (f.big ? 30 : 20) * (0.5 + p * 3), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = p < 0.25 ? '#fff3c4' : p < 0.5 ? C.amber : p < 0.75 ? C.danger : C.steel;
      for (const q of f.parts) { const s = q.size * P; ctx.fillRect(Math.round(q.x - s / 2), Math.round(q.y - s / 2), s, s); }
    } else if (f.type === 'splash') {
      ctx.fillStyle = '#cfe9ff'; ctx.globalAlpha = 1 - p;
      for (const q of f.parts) ctx.fillRect(Math.round(q.x), Math.round(q.y), P, P);
      ctx.globalAlpha = 1;
    } else if (f.type === 'mark') {
      const c = cellCenter(f.li, f.row);
      if (Math.floor(f.t * 10) % 2 === 0) {
        brackets(Math.round(c.x - G.cellW / 2 + 2) + 0.5, Math.round(c.y - G.cellH / 2 + 2) + 0.5, Math.round(G.cellW - 4), Math.round(G.cellH - 4), f.color || C.amber, Math.max(6, G.cellH * 0.3));
      }
      // "FIRE ALPHA7" tag on the targeted square: above it, or below it on the top row next to the letters
      if (f.label) {
        const fs = Math.max(8, Math.min(13, Math.round(G.cellH * 0.28)));
        ctx.font = `700 ${fs}px Silkscreen, "Silkscreen SK", monospace`;
        const tw = Math.min(ctx.measureText(f.label).width, W - G.x0 - 8), bw = tw + 10, bh = fs + 8;
        const bx = Math.min(Math.max(c.x - bw / 2, G.x0 + 2), W - bw - 2);
        const by = f.row === 0 ? c.y + G.cellH / 2 + 2 : c.y - G.cellH / 2 - bh - 2;
        ctx.globalAlpha = f.t > f.dur - 0.3 ? Math.max(0, (f.dur - f.t) / 0.3) : 1;
        ctx.fillStyle = C.abyss;
        ctx.fillRect(Math.round(bx), Math.round(by), Math.round(bw), Math.round(bh));
        ctx.strokeStyle = f.color || C.amber; ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(bx) + 0.5, Math.round(by) + 0.5, Math.round(bw) - 1, Math.round(bh) - 1);
        ctx.fillStyle = f.color || C.amber;
        pixelLabel(f.label, bx + bw / 2, by + bh / 2 + 1, tw, fs);
        ctx.globalAlpha = 1;
      }
    } else if (f.type === 'text') {
      ctx.globalAlpha = 1 - p; ctx.fillStyle = f.color;
      ctx.font = `700 ${Math.max(11, Math.round(G.cellH * 0.38))}px Silkscreen, "Silkscreen SK", monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.txt, f.x, f.y - p * 30);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBanner() {
  const next = S.level + 1, sea = seaOf(next);
  const title = next === sea.first ? sea.name.toUpperCase() : 'LEVEL ' + String(levelInSea(next)).padStart(2, '0');
  const y = G.y0 + G.cellH * 1.5, h = G.cellH * 2.2;
  ctx.fillStyle = C.abyss; ctx.globalAlpha = 0.85;
  ctx.fillRect(0, y, W, h);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.sonar; ctx.fillRect(0, y, W, 2); ctx.fillRect(0, y + h - 2, W, 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.amber;
  let fs = Math.round(Math.min(h * 0.32, 24));
  ctx.font = `700 ${fs}px Silkscreen, "Silkscreen SK", monospace`;
  const tw = ctx.measureText(title).width;
  if (tw > W - 24) {
    fs = Math.floor(fs * (W - 24) / tw);
    ctx.font = `700 ${fs}px Silkscreen, "Silkscreen SK", monospace`;
  }
  fillTextM(title, W / 2, y + h * 0.36);
  ctx.fillStyle = C.ink;
  ctx.font = `400 ${Math.round(Math.min(h * 0.22, 16))}px Silkscreen, "Silkscreen SK", monospace`;
  fillTextM(tr('bannerSector') + ' ' + sectorOf(next).join(' · '), W / 2, y + h * 0.7);
}

/* ---------- HUD ---------- */
const HEART = '<svg viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>';
function updateHUD() {
  $('hudLevel').textContent = String(levelInSea(S.level)).padStart(2, '0') + '/' + seaOf(S.level).levels;
  $('hudSector').innerHTML = mHtml(sectorOf(S.level).join('·'));
  $('hudScore').textContent = S.score;
  const mult = S.inGame ? streakMult() : 1;
  $('hudMult').hidden = mult < 2;
  $('hudMult').textContent = '×' + mult;
  let h = '';
  for (let i = 0; i < MAX_LIVES; i++) h += `<span class="${i < S.lives ? '' : 'lost'}">${HEART}</span>`;
  $('hudLives').innerHTML = h;
  $('hudLives').setAttribute('aria-label', tr('lives', S.lives, MAX_LIVES));
  renderPeer();
}
const timeFill = $('timeFill');
function updateTimer() {
  const p = S.mode === 'transition' || S.mode === 'won' ? 1 : Math.min(1, S.levelTime / LEVEL_TIME);
  timeFill.style.width = (p * 100).toFixed(1) + '%';
}

function renderCheat() {
  const el = $('cheat');
  el.hidden = !S.help;
  $('btnHelp').setAttribute('aria-pressed', String(S.help));
  if (!S.help) return;
  const letters = sectorOf(S.level);
  const item = ch => `<span><b>${mHtml(ch)}</b>${pretty(MORSE[ch])}</span>`;
  el.innerHTML =
    `<div class="cheat-row letters">${letters.map(item).join('')}</div>` +
    `<div class="cheat-row">${DIGITS.slice(0, 5).map(item).join('')}</div>` +
    `<div class="cheat-row">${DIGITS.slice(5).map(item).join('')}</div>`;
}

/* ---------- morse input ---------- */
const keyEl = $('key'), keyFill = $('keyFill');
let toastTimer = null;
function toast(msg, kind) {
  const t = $('toast');
  t.innerHTML = mHtml(msg.toUpperCase());
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast' + (kind ? ' ' + kind : ''); }, 1400);
}

function canType() { return S.mode === 'play'; }

function keyPress() {
  if (!canType() || I.down) return;
  initAudio();
  I.down = true;
  I.t0 = performance.now();
  clearTimeout(I.gapTimer);
  tone(true);
  keyEl.classList.add('down');
}
function keyRelease(silent) {
  if (!I.down) return;
  I.down = false;
  tone(false);
  keyEl.classList.remove('down');
  keyFill.style.width = '0'; keyFill.className = '';
  if (silent || !canType()) return;
  const dur = performance.now() - I.t0;
  I.buf += dur < TEMPO[S.tempo].dot ? '.' : '-';
  if (I.buf.length > 5) {
    toast(tr('tLong'), 'warn'); sfx.error();
    I.buf = '';
  } else {
    clearTimeout(I.gapTimer);
    I.gapTimer = setTimeout(commitChar, TEMPO[S.tempo].gap);
  }
  renderInput();
}
function updateKeyFill() {
  const dot = TEMPO[S.tempo].dot;
  const el = performance.now() - I.t0;
  if (el < dot) { keyFill.style.width = (el / dot * 50).toFixed(1) + '%'; keyFill.className = ''; }
  else { keyFill.style.width = '100%'; keyFill.className = 'dash'; }
}

function commitChar() {
  if (!canType() || !I.buf) return;
  const code = I.buf;
  const ch = DECODE[code];
  I.buf = '';
  if (!ch) {
    toast(tr('tUnknown', pretty(code)), 'warn'); sfx.error();
  } else if (/[A-Z]/.test(ch)) {
    I.letter = ch; I.digit = null; I.last = '';
  } else if (!I.letter) {
    toast(tr('tLetterFirst'), 'warn'); sfx.error();
  } else {
    I.digit = ch;
    const l = I.letter;
    I.last = l + ch;
    I.letter = null; I.digit = null;
    fire(l, ch);
  }
  renderInput();
}

function clearInput(full) {
  clearTimeout(I.gapTimer);
  I.buf = ''; I.letter = null; I.digit = null;
  if (full) I.last = '';
  renderInput();
}

function renderInput() {
  sendTyping();
  const sL = $('slotL'), sD = $('slotD');
  const showLast = !I.letter && !I.buf && I.last;
  const ltr = I.letter || (showLast ? I.last[0] : '');
  sL.innerHTML = `<span>${ltr ? mHtml(PHONETIC[ltr]) : '_'}</span>`;
  sD.textContent = showLast ? I.last[1] : '_';
  sL.className = 'slot' + (ltr ? ' word' : '') + (I.letter ? ' filled' : showLast ? ' last' : '');
  sD.className = 'slot' + (showLast ? ' last' : '');
  $('bufSym').innerHTML = I.buf.split('').map(s => `<i class="${s === '.' ? 'dot' : 'dash'}"></i>`).join('');
  const hint = $('bufHint');
  if (I.buf) {
    const ch = DECODE[I.buf];
    hint.innerHTML = ch ? `= <b>${ch}</b>` : '…';
  } else if (I.letter) {
    hint.textContent = tr('hintRow');
  } else if (showLast) {
    hint.textContent = tr('hintFired', spoken(I.last[0], I.last[1]));
  } else {
    hint.textContent = tr('hintStart');
  }
}

keyEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { keyEl.setPointerCapture(e.pointerId); } catch (err) {}
  keyPress();
});

function showScores(message) {
  const list = history();
  const best = Math.max(0, ...list.map(x => x.score));
  const rows = list.map(r => {
    const d = new Date(r.t);
    const meta = [];
    if (r.ship) meta.push(r.ship);
    if (TEMPO[r.tempo]) meta.push(TEMPO[r.tempo].label + (r.partner ? ' · ' + r.partner : ''));
    if (SEAS[r.sea]) meta.push(SEAS[r.sea].name + (r.level ? `, level ${r.level}` : ''));
    meta.push(RESULTS[r.result] || r.result || '');
    return `<li class="${r.score > 0 && r.score === best ? 'top' : ''}">
      <div class="hist-main">
        <span class="hist-when">${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() : ''} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</span>
        <span class="hist-meta">${esc(meta.filter(Boolean).join(' · '))}</span>
      </div>
      <span class="val">${r.score}</span>
    </li>`;
  }).join('');
  showOverlay(`
    <h2>${tr('scores')}</h2>
    <div class="stats"><div><span class="lbl">${tr('record')}</span><span class="val">${S.best}</span></div></div>
    <div class="seg-label">${tr('lastGames')}</div>
    ${list.length
      ? `<ol class="hist">${rows}</ol>`
      : `<p class="foot">${tr('noGames')}</p>`}
    <div class="hist-tools">
      <button class="pixel-btn" id="histExport"${list.length ? '' : ' disabled'}>Export</button>
      <button class="pixel-btn" id="histImport">Import</button>
      <input type="file" id="histFile" accept=".xml,.txt,text/xml,application/xml,text/plain" hidden>
    </div>
    <p class="hist-status" id="histStatus" role="status">${message ? esc(message) : ''}</p>
    <div class="hist-copy" id="histCopy" hidden>
      <textarea class="hist-xml" id="histXml" readonly aria-label="${tr('xmlAria')}"></textarea>
      <button class="pixel-btn" id="histCopyBtn">${tr('copyXml')}</button>
    </div>
    <button class="cta" id="goBack">${tr('back')}</button>
    <p class="credit">Created by Ivan Hrušovský</p>
  `, '#goBack');
  $('goBack').addEventListener('click', showMenu);
  $('histExport').addEventListener('click', () => exportHistory(list));
  $('histImport').addEventListener('click', () => $('histFile').click());
  $('histFile').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const status = $('histStatus');
    if (f.size > 1000000) { status.textContent = tr('fTooBig'); return; }
    try {
      const runs = parseHistoryXml(await f.text());
      if (!runs.length) throw new Error('empty');
      const added = importRuns(runs);
      showScores(added ? tr('fAdded', added, runs.length) : tr('fKnown'));
    } catch (err) {
      status.textContent = tr('fBad');
    }
  });
}

// Saves through the viewer's download prompt; where saving is not available, shows the XML to copy instead.
async function exportHistory(list) {
  const xml = historyXml(list);
  const status = $('histStatus');
  const d = new Date();
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try {
      await dl.save({ filename: `${tr('fileBase')}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.xml.txt`, data: xml });
      status.textContent = tr('xSaved');
      return;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') { status.textContent = tr('xDeclined'); return; }
      if (code === 'rate_limited') { status.textContent = tr('xBusy'); return; }
    }
  } else if (!window.claude) {
    // Standalone copy (e.g. GitHub Pages): an ordinary browser download of a real .xml file.
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([xml], { type: 'application/xml' }));
      a.download = `${tr('fileBase')}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.xml`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      status.textContent = tr('xDownloaded');
      return;
    } catch (e) { /* fall through to copying */ }
  }
  status.textContent = tr('xNoSave');
  $('histXml').value = xml;
  $('histCopy').hidden = false;
  $('histCopyBtn').onclick = () => {
    const ta = $('histXml');
    const fallback = () => { ta.focus(); ta.select(); status.textContent = tr('xSelected'); };
    try {
      navigator.clipboard.writeText(xml).then(() => { status.textContent = tr('xCopied'); }, fallback);
    } catch (e) { fallback(); }
  };
}

/* ---------- dock: one saved game ---------- */
// Saved from the pause screen; overwrites any earlier save. Leaving the dock restores the run; the player
// may pay REPAIR_COST points for one more life (never above MAX_LIVES).
const REPAIR_COST = 500;
function loadDock() {
  const d = store.get('dock', null);
  return d && Number.isFinite(d.level) && d.level >= 1 && d.level <= TOTAL_LEVELS ? d : null;
}
function saveToDock() {
  // Paused during the slide to the next sector: dock at the start of that sector.
  const mid = S.pausedFrom === 'transition';
  store.set('dock', {
    t: Date.now(), tempo: S.tempo, lives: S.lives, score: S.score,
    level: mid ? S.level + 1 : S.level,
    levelTime: mid ? 0 : S.levelTime,
    levelStartScore: mid ? S.score : S.levelStartScore,
    hitThisLevel: mid ? false : S.hitThisLevel,
    jam: S.jam,
  });
  S.inGame = false;   // docked, not finished: no history entry yet
  toMenu();
}
const canRepair = d => (d.lives || 1) < MAX_LIVES && d.score >= REPAIR_COST;
function sailFromDock(repair) {
  const d = loadDock();
  if (!d) { startGame(1, 0); return; }
  const fix = repair && canRepair(d) ? REPAIR_COST : 0;
  if (TEMPO[d.tempo]) { S.tempo = d.tempo; store.set('tempo', S.tempo); }
  startGame(d.level, d.score - fix);
  Object.assign(S, {
    levelTime: Math.min(LEVEL_TIME - 1, Math.max(0, d.levelTime || 0)),
    levelStartScore: Math.max(0, (d.levelStartScore ?? d.score) - fix),
    hitThisLevel: !!d.hitThisLevel,
    lives: (d.lives || 1) + (fix ? 1 : 0),
    jam: d.jam && typeof d.jam === 'object' ? d.jam : {},
  });
  renderCheat(); updateHUD();
  setTimeout(() => toast(fix ? tr('dockRepaired', REPAIR_COST) : tr('dockLeft')), 300);
}
function showDock(d) {
  const when = new Date(d.t);
  let hearts = '';
  for (let i = 0; i < MAX_LIVES; i++) hearts += `<span class="${i < d.lives ? '' : 'lost'}">${HEART}</span>`;
  showOverlay(`
    <h2>${tr('dockTitle')}</h2>
    <p>${tr('dockLead')}</p>
    <div class="dock-card">
      <p>${tr('pauseLine', seaOf(d.level).name, levelInSea(d.level), (d.jam && d.jam[d.level] ? d.jam[d.level] : sectorOf(d.level)).join(' · '), d.score)}</p>
      <div class="dock-meta"><span class="lives">${hearts}</span><span>${TEMPO[d.tempo] ? TEMPO[d.tempo].label : ''}</span><span>${tr('dockSavedAt', `${when.getDate()}.${when.getMonth() + 1}. ${pad2(when.getHours())}:${pad2(when.getMinutes())}`)}</span></div>
    </div>
    <p class="foot">${(d.lives || 1) >= MAX_LIVES ? tr('repairFull') : d.score < REPAIR_COST ? tr('repairNeed', REPAIR_COST) : tr('dockRepair', REPAIR_COST)}</p>
    ${canRepair(d) ? `<button class="cta" id="goDockFix">${tr('repairGo', REPAIR_COST)}</button>` : ''}
    <button class="cta${canRepair(d) ? ' alt' : ''}" id="goDockOn">${tr('dockContinue')}</button>
    <button class="cta alt" id="goNewMission">${tr('newMission')}</button>
    <button class="cta alt" id="goBack">${tr('back')}</button>
  `, canRepair(d) ? '#goDockFix' : '#goDockOn');
  if (canRepair(d)) $('goDockFix').addEventListener('click', () => sailFromDock(true));
  $('goDockOn').addEventListener('click', () => sailFromDock(false));
  $('goNewMission').addEventListener('click', () => startGame(1, 0));
  $('goBack').addEventListener('click', showMenu);
}

function toMenu() {
  recordGame('home');
  Object.assign(S, { subs: [], fx: [], ring: null, transition: null, level: 1, levelTime: 0, score: 0, lives: MAX_LIVES, inGame: false });
  clearInput(true);
  updateHUD(); renderCheat();
  showMenu();

// with the code, sees the captain's sea through state snapshots and sends its shots; the captain resolves

function loadScript(src) {
  return new Promise((ok, fail) => {
    if ([...document.scripts].some(s => s.src === src)) { ok(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = () => ok(); s.onerror = () => fail(new Error('load ' + src));
    document.head.appendChild(s);
  });
}
async function coopNet() {
  if (CO.db) return;
  for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']) await loadScript(FB_SDK + f);
  const fb = window.firebase;
  if (!fb.apps.length) fb.initializeApp(FB_CONFIG);
  const cred = await fb.auth().signInAnonymously();
  CO.uid = cred.user.uid;
  CO.db = fb.database();
}
const roomRef = code => CO.db.ref('rooms/' + code);
function listen(ref, ev, fn) { ref.on(ev, fn); CO.subs.push(() => ref.off(ev, fn)); }
function coopReset() {
  CO.subs.forEach(off => { try { off(); } catch (e) {} });
  CO.subs = [];
  clearInterval(CO.waitTimer); clearTimeout(CO.lostTimer);
  Object.assign(CO, { on: false, role: null, code: '', ref: null, peer: null, peerOnline: false, peerLetter: '', peerScore: 0,
    gScore: 0, gStreak: 0, lastTyping: null, alone: false, waitTimer: null, lostTimer: null, ended: false, remotePause: false });
  CO.sunk.clear();

}
// Leaves the room for good: the captain deletes it, the crew steps off the ship.
function coopLeave() {

  try { (role === 'h' ? ref.remove() : ref.child('guest').remove()).catch(() => {}); ref.child('on/' + role).remove().catch(() => {}); } catch (e) {}
}
// Presence: my flag is on while I'm connected and disappears by itself when I drop.
function coopPresence() {
  const me = CO.ref.child('on/' + CO.role);
  listen(CO.db.ref('.info/connected'), 'value', s => {
    if (s.val() !== true) return;
    me.onDisconnect().remove().then(() => me.set(true)).catch(() => {});

}
function emit(type, data) {
  if (!isCaptain() || !CO.peerOnline) return;
  CO.ref.child('ev').push(Object.assign({ type }, data || {})).catch(() => {});
}

/* --- screens: choose, create, join --- */
function showCoop(msg) {

async function coopConnect(status) {
  if (status) status.textContent = tr('coConnecting');
  try { await coopNet(); return true; } catch (e) {
    if (status) status.textContent = tr('coNoNet');

}
async function coopCreate() {
  if (!(await coopConnect($('coStatus')))) return;
  let code = '', ref = null;
  for (let i = 0; i < 6 && !ref; i++) {
    code = Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    const r = roomRef(code);
    try {
      const res = await r.transaction(cur => (cur === null
        ? { v: 1, t: Date.now(), phase: 'lobby', host: { uid: CO.uid, name: playerName(), ship: shipName() } }
        : undefined));
      if (res.committed) ref = r;
    } catch (e) { break; }
  }
  if (!ref) { const st = $('coStatus'); if (st) st.textContent = tr('coNoNet'); return; }
  coopReset();
  Object.assign(CO, { on: true, role: 'h', code, ref });
  coopPresence();
  listen(ref.child('guest'), 'value', s => {
    const g = s.val();
    const had = !!CO.peer;
    CO.peer = g ? { name: cleanText(g.name, NAME_MAX) || tr('coCrew') } : null;
    if (S.mode === 'menu') { renderLobby(); return; }
    if (had && !g && S.inGame && S.mode !== 'over') crewGone(true);
  });
  listen(ref.child('on/g'), 'value', s => {
    const was = CO.peerOnline;
    CO.peerOnline = s.val() === true;
    if (S.mode === 'menu') { renderLobby(); return; }
    if (!S.inGame || S.mode === 'over') return;
    if (was && !CO.peerOnline) crewGone(false);
    else if (!was && CO.peerOnline && CO.waitTimer) crewBack();
  });
  listen(ref.child('cmd'), 'child_added', s => {
    const c = s.val();
    s.ref.remove().catch(() => {});
    if (c && c.type === 'fire' && S.mode === 'play') crewShot(c.l, c.d);
  });
  listen(ref.child('typing/g'), 'value', s => { CO.peerLetter = s.val() || ''; renderPeer(); });
  listen(ref.child('pause'), 'value', s => remotePause(s.val()));
  showLobby();
}
const roomLink = () => location.origin + location.pathname + '?room=' + CO.code;
function showLobby() {
  showOverlay(`
    <h2>${tr('coTitle')}</h2>

async function drawQr(cvs, text) {
  try {
    await loadScript(QR_LIB);
    const qr = window.qrcode(0, 'M');
    qr.addData(text); qr.make();
    const n = qr.getModuleCount(), q = 2, cells = n + q * 2;
    const css = Math.min(200, Math.floor((card.clientWidth - 40) / cells) * cells);
    const dpr = window.devicePixelRatio || 1, px = Math.max(1, Math.floor(css * dpr / cells));
    cvs.width = cvs.height = cells * px;
    cvs.style.width = cvs.style.height = (cells * px / dpr) + 'px';
    const c = cvs.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, cvs.width, cvs.height);
    c.fillStyle = '#06111c';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) c.fillRect((k + q) * px, (r + q) * px, px, px);
  } catch (e) { cvs.hidden = true; }
}
function showJoin(code, msg) {
